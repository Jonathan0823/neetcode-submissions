name: LeetCode Recall

on:
  push:
    branches: [main]
    paths:
      - "Data Structures & Algorithms/**"
  workflow_dispatch:
    inputs:
      mode:
        description: What do you want to run?
        required: true
        default: sync
        type: choice
        options:
          - sync
          - rebuild
          - daily-queue
  schedule:
    - cron: "0 17 * * *"
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: leetcode-recall-main
  cancel-in-progress: false

jobs:
  recall:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RECALL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event_name == 'issues' && 'issue' || github.event_name == 'schedule' && 'daily-queue' || 'sync' }}
    steps:
      - name: Check out full history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install configuration dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Reconcile repository and Issues
        id: reconcile
        run: python -m scripts.recall.cli "$RECALL_MODE"

      - name: Commit recall data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recall
          if git diff --cached --quiet; then
            echo "No recall data changes to commit."
          else
            git commit -m "chore: update recall state"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "Unable to push after three attempts; review acknowledgements were not sent."
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
            done
          fi

      - name: Acknowledge persisted review Issues
        run: python -m scripts.recall.cli ack
