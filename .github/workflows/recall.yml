name: LeetCode Recall

on:
  push:
    branches: [main]
    paths:
      - "Data Structures & Algorithms/**"
  workflow_dispatch:
    inputs:
      mode:
        description: What do you want to run?
        required: true
        default: sync
        type: choice
        options:
          - sync
          - rebuild
          - daily-queue
  schedule:
    - cron: "0 17 * * *"
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: leetcode-recall-main
  cancel-in-progress: false

jobs:
  recall:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RECALL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event_name == 'issues' && 'issue' || github.event_name == 'schedule' && 'daily-queue' || 'sync' }}
      RECALL_FORCE_NEW_ISSUE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'daily-queue' && '1' || '0' }}
    steps:
      - name: Check out full history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install configuration dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Reconcile, commit, and push recall data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Reconciliation attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            python -m scripts.recall.cli "$RECALL_MODE"
            git add recall

            if git diff --cached --quiet; then
              echo "No recall data changes to commit."
              break
            fi

            git commit -m "chore: update recall state"
            if git push origin HEAD:main; then
              break
            fi

            if [ "$attempt" = 3 ]; then
              echo "Unable to push after three regeneration attempts; review acknowledgements were not sent."
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Acknowledge persisted review Issues
        run: python -m scripts.recall.cli ack
